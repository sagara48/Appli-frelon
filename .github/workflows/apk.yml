 name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompression du projet
        run: unzip -o projet.zip -d .
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Fichiers générés
        run: pip install pillow && python3 scripts/preparer.py
      - name: Dépendances
        run: npm install --legacy-peer-deps
      - name: Vérification du code et des calculs
        run: npx tsc --noEmit && npx tsx scripts/test_calculs.ts
      - name: Projet Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilation de l'APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: appli-frelons-apk
          path: android/app/build/outputs/apk/release/*.apk
